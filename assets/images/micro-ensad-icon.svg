<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="ensadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F5EAD" />
      <stop offset="100%" stop-color="#092A5C" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Circle -->
  <circle cx="50" cy="50" r="46" fill="url(#ensadGrad)" stroke="#55A9E8" stroke-width="2.5" />

  <!-- Headphones Arc -->
  <path d="M 24 50 A 26 26 0 0 1 76 50" fill="none" stroke="#FFE52B" stroke-width="4.5" stroke-linecap="round" />
  <!-- Headphone Earcups -->
  <rect x="20" y="46" width="7" height="15" rx="3.5" fill="#FFE52B" />
  <rect x="73" y="46" width="7" height="15" rx="3.5" fill="#FFE52B" />

  <!-- Microphone Body -->
  <rect x="42" y="32" width="16" height="26" rx="8" fill="#FFFFFF" />
  <!-- Mic Grille Lines -->
  <line x1="45" y1="38" x2="55" y2="38" stroke="#1F5EAD" stroke-width="1.8" stroke-linecap="round" />
  <line x1="45" y1="43" x2="55" y2="43" stroke="#1F5EAD" stroke-width="1.8" stroke-linecap="round" />
  <line x1="45" y1="48" x2="55" y2="48" stroke="#1F5EAD" stroke-width="1.8" stroke-linecap="round" />

  <!-- ENSAD Badge on Mic -->
  <rect x="39" y="52" width="22" height="7" rx="3.5" fill="#FFE52B" />
  <text x="50" y="57" font-family="'Fredoka', sans-serif" font-size="5.5" font-weight="bold" fill="#092A5C" text-anchor="middle">ENSAD</text>

  <!-- Mic Stand Arc -->
  <path d="M 37 49 A 13 13 0 0 0 63 49" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  <!-- Mic Stem & Base -->
  <line x1="50" y1="62" x2="50" y2="72" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  <line x1="40" y1="72" x2="60" y2="72" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />

  <!-- Decorative Sparkles -->
  <circle cx="28" cy="28" r="2" fill="#FFE52B" />
  <circle cx="72" cy="28" r="2" fill="#FFE52B" />
</svg>
